<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="100%" stop-color="#082b4c"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldPing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Shield / Disc -->
  <rect width="64" height="64" rx="16" fill="url(#oceanBg)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Sonar Arc Pulses -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="32" cy="34" r="16" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.6"/>
  <circle cx="32" cy="34" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Marine Wave (Ocean Crest) -->
  <path d="M14 42 C 20 38, 24 44, 32 40 C 40 36, 44 42, 50 38" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Acoustic Ping / Target Core -->
  <circle cx="32" cy="34" r="3.5" fill="url(#emeraldPing)"/>
  <circle cx="32" cy="34" r="6" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.75"/>
</svg>